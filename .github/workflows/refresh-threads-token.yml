name: Refresh Threads access token

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: characzone-threads-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.THREADS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test token renewal
        run: |
          pip install -r requirements-threads.txt
          python -m unittest discover -s tests -p 'test_threads_refresh.py' -v
      - uses: actions/checkout@v4
        with:
          ref: threads-token-state
          path: .threads-token-state
      - name: Check and renew Threads credential
        env:
          THREADS_TOKEN_STATE_DIR: .threads-token-state
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python refresh_threads_token.py
      - name: Explain recovery on failure
        if: failure()
        run: echo 'Threads renewal failed. Daily checks retry automatically. Review this run; revoked or expired access requires Meta reauthorization. Pending encrypted credentials are recovered on rerun. No content was posted.' >> "$GITHUB_STEP_SUMMARY"
