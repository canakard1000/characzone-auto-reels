name: Refresh Threads access token

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: characzone-threads-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test renewal safeguards
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_threads_refresh.py' -v
      - name: Renew token and verify publishing account
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python refresh_threads_token.py
