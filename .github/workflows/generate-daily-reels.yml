name: Generate daily Characzone reels
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "KST publication date (YYYY-MM-DD); blank creates tomorrow"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: characzone-content-state
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate two varied approval-gated reels
        run: |
          if [ -n "${{ inputs.date }}" ]; then python generate_daily_reels.py --date "${{ inputs.date }}"; else python generate_daily_reels.py; fi
      - name: Save videos and approval queue
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain -- 'characzone-*.mp4')" ]; then exit 0; fi
          git config user.name characzone-reels-bot
          git config user.email actions@users.noreply.github.com
          git add approved.json characzone-*.mp4
          git commit -m "Prepare daily reels for approval"
          git push
      - name: Send Telegram preview requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py
      - name: Save Telegram notification state
        run: |
          if git diff --quiet; then exit 0; fi
          git add approved.json
          git commit -m "Mark reel previews as notified"
          git push
