name: Sync Telegram reel approvals
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: characzone-content-state
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Apply approval commands from owner chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_V2 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sync_telegram_approvals.py
      - name: Save approval and cursor state
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name characzone-reels-bot
          git config user.email actions@users.noreply.github.com
          git add approved.json telegram-state.json
          git commit -m "Apply Telegram reel approval"
          git push
      - name: Check and publish any due approved reel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-approved-reel.yml --ref main -f preflight_only=false
