name: Send gacha inquiry report to Telegram

on:
  push:
    branches:
      - main
    paths:
      - reports/gacha-inquiries/latest.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gacha-inquiry-telegram-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_gacha_inquiry_report.py
