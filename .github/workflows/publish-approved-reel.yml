name: Publish approved Instagram reel

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Validate secrets, Instagram account, and video URL without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-reel-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preflight or publish an approved reel
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only || 'false' }}
        run: python publish_reel.py
      - name: Save publication status
        if: github.event_name == 'schedule' || inputs.preflight_only == false
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "characzone-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add approved.json
          git commit -m "Mark reel as published"
          git push
